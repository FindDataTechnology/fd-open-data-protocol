# FindData vocabulary — concept families.
#
# The first level of the two-level concept model. A *Concept family* is the
# small, curated semantic vocabulary (`fd:GDP`, `fd:Population`, ...); a
# *Variable* is the qualified five-tuple identity that lives in the MCP
# ontology store `concepts` table and carries `concept_code` pointing back here.
#
# URIs: https://schema.finddata.tech/concept/<id>
#
# `variables:` blocks are the initial seed content — the five-tuple identities
# `consume-concepts` materializes for that family. Families without a
# `variables:` block are declarative only (derivation links to them by code).
#
# Entries are never deleted — retirement is expressed with `superseded_by`.
version: "2026.11"
kind: concept
entries:
  - id: GDP
    label_en: Gross Domestic Product
    label_zh: 国内生产总值
    description: >-
      The market value of all final goods and services produced within a
      country's borders in a period. The qualified variants (nominal, real,
      PPP, per-capita, growth) are distinct Variables of this family.
    value_type: currency
    unit_type: currency
    dimensions: [nominal_current, real_constant, ppp, per_capita, per_capita_ppp, growth]
    variables:
      - {code: gdp, entity_type: country, measure: nominal_current,  unit: usd,           frequency: yearly}
      - {code: gdp, entity_type: country, measure: real_constant,    unit: usd,           frequency: yearly}
      - {code: gdp, entity_type: country, measure: growth,           unit: "%",           frequency: yearly}
      - {code: gdp, entity_type: country, measure: per_capita,       unit: usd,           frequency: yearly}
      - {code: gdp, entity_type: country, measure: per_capita_ppp,   unit: international, frequency: yearly}

  - id: Population
    label_en: Population
    label_zh: 人口
    description: >-
      Total resident population of an entity at a point in time. Aligns with
      Data Commons Count_Person and World Bank SP.POP.TOTL.
    value_type: count
    unit_type: count
    dimensions: []
    variables:
      - {code: population.total, entity_type: country, measure: "", unit: persons, frequency: yearly}

  - id: PriceClose
    label_en: Closing Price
    label_zh: 收盘价
    description: >-
      Price of the last trade in a session — the canonical closing quote for a
      listed instrument.
    value_type: currency
    unit_type: currency
    dimensions: []
    variables:
      - {code: price.close, entity_type: stock, measure: "", unit: currency, frequency: daily}

  - id: PriceOpen
    label_en: Opening Price
    label_zh: 开盘价
    description: Price of the first trade in a session.
    value_type: currency
    unit_type: currency
    dimensions: []
    variables:
      - {code: price.open, entity_type: stock, measure: "", unit: currency, frequency: daily}

  - id: PriceHigh
    label_en: Session High Price
    label_zh: 最高价
    description: Highest traded price during a session.
    value_type: currency
    unit_type: currency
    dimensions: []
    variables:
      - {code: price.high, entity_type: stock, measure: "", unit: currency, frequency: daily}

  - id: PriceLow
    label_en: Session Low Price
    label_zh: 最低价
    description: Lowest traded price during a session.
    value_type: currency
    unit_type: currency
    dimensions: []
    variables:
      - {code: price.low, entity_type: stock, measure: "", unit: currency, frequency: daily}

  - id: PriceVolume
    label_en: Traded Volume
    label_zh: 成交量
    description: Number of units traded during a session.
    value_type: count
    unit_type: count
    dimensions: []
    variables:
      - {code: price.volume, entity_type: stock, measure: "", unit: shares, frequency: daily}

  - id: PriceAmount
    label_en: Traded Turnover
    label_zh: 成交额
    description: Monetary value traded during a session.
    value_type: currency
    unit_type: currency
    dimensions: []
    variables:
      - {code: price.amount, entity_type: stock, measure: "", unit: currency, frequency: daily}

  - id: NavUnit
    label_en: Net Asset Value per Unit
    label_zh: 单位净值
    description: >-
      Net asset value of one fund unit — the canonical daily price series for
      funds and ETFs.
    value_type: currency
    unit_type: currency
    dimensions: []
    variables:
      - {code: nav.unit, entity_type: fund, measure: "", unit: currency, frequency: daily}

  - id: Revenue
    label_en: Revenue
    label_zh: 营业收入
    description: Operating revenue recognized in a reporting period.
    value_type: currency
    unit_type: currency
    dimensions: [growth]
    variables:
      - {code: financials.revenue, entity_type: stock, measure: "", unit: currency, frequency: yearly}

  - id: NetProfit
    label_en: Net Profit
    label_zh: 净利润
    description: Profit attributable to the reporting entity after tax.
    value_type: currency
    unit_type: currency
    dimensions: [growth]
    variables:
      - {code: financials.net_profit, entity_type: stock, measure: "", unit: currency, frequency: yearly}

  - id: TotalAssets
    label_en: Total Assets
    label_zh: 资产总计
    description: Carrying amount of all assets at the reporting date.
    value_type: currency
    unit_type: currency
    dimensions: []
    variables:
      - {code: financials.total_assets, entity_type: stock, measure: "", unit: currency, frequency: yearly}

  - id: TotalLiabilities
    label_en: Total Liabilities
    label_zh: 负债合计
    description: Carrying amount of all liabilities at the reporting date.
    value_type: currency
    unit_type: currency
    dimensions: []
    variables:
      - {code: financials.total_liabilities, entity_type: stock, measure: "", unit: currency, frequency: yearly}

  - id: Inflation
    label_en: Inflation Rate
    label_zh: 通货膨胀率
    description: >-
      Rate of change of a general price level, typically consumer prices.
      Aligns with World Bank FP.CPI.TOTL.ZG.
    value_type: ratio
    unit_type: percent
    dimensions: []
    variables: []

  - id: Unemployment
    label_en: Unemployment Rate
    label_zh: 失业率
    description: >-
      Share of the labour force that is without work and seeking it. Aligns
      with World Bank SL.UEM.TOTL.ZS.
    value_type: ratio
    unit_type: percent
    dimensions: []
    variables: []

  - id: LifeExpectancy
    label_en: Life Expectancy
    label_zh: 预期寿命
    description: >-
      Expected years of life at birth for a given population. Aligns with
      World Bank SP.DYN.LE00.IN.
    value_type: duration
    unit_type: count
    dimensions: []
    variables: []

  - id: CO2Emissions
    label_en: CO2 Emissions
    label_zh: 二氧化碳排放
    description: >-
      Carbon dioxide emissions from fuel combustion, total or per capita.
      Aligns with World Bank EN.ATM.CO2E.KT and EN.ATM.CO2E.PC.
    value_type: count
    unit_type: count
    dimensions: [per_capita]
    variables: []

  - id: DocTitle
    label_en: Document Title
    label_zh: 文档标题
    description: Title of a published document (notice, report, filing).
    value_type: text
    unit_type: none
    dimensions: []
    variables: []

  - id: DocDate
    label_en: Document Date
    label_zh: 文档日期
    description: Publication or effective date of a document.
    value_type: date
    unit_type: none
    dimensions: []
    variables: []

  - id: DocUrl
    label_en: Document URL
    label_zh: 文档链接
    description: Canonical web address of a published document.
    value_type: text
    unit_type: none
    dimensions: []
    variables: []

  - id: TradeFlow
    label_en: Trade flow value
    label_zh: 贸易流值
    description: >-
      Annual trade flow value (FOB, USD) for a China export commodity at
      HS6 level, split by partner economy. The partner axis is expressed
      encoded in the concept code (trade.export_flow.world/us/de/jp/uk,
      one series per code per the dashboard plane contract); the import
      side joins when an import batch lands. Source: UN Comtrade annual HS flows.
    value_type: currency
    unit_type: currency
    dimensions: [world, us, de, jp, uk]
    variables:
      # 看板取数契约（data_plane.series 只按 code+source+entity 过滤）：
      # 伙伴国轴编进 concept code，measure 统一 export——一序列一码。
      - {code: trade.export_flow.world, entity_type: hs_code, measure: export, unit: usd, frequency: yearly}
      - {code: trade.export_flow.us,    entity_type: hs_code, measure: export, unit: usd, frequency: yearly}
      - {code: trade.export_flow.de,    entity_type: hs_code, measure: export, unit: usd, frequency: yearly}
      - {code: trade.export_flow.jp,    entity_type: hs_code, measure: export, unit: usd, frequency: yearly}
      - {code: trade.export_flow.uk,    entity_type: hs_code, measure: export, unit: usd, frequency: yearly}
      # 进口侧（add-flower-vertical 3.2）：与出口同形，一字之差在 measure。
      # 花卉三档（060311/060319/060120）先落 world 轴；伙伴国明细不展开。
      - {code: trade.import_flow.world, entity_type: hs_code, measure: import, unit: usd, frequency: yearly}

  - id: FxRate
    label_en: FX reference rate
    label_zh: 汇率参考价
    description: >-
      Reference/middle exchange rate for a currency pair, quoted in the
      quote currency per one unit of base (EURCNY = CNY per 1 EUR).
      Sources: ECB EXR monthly reference; PBOC middle rate when it lands.
    value_type: number
    unit_type: currency
    dimensions: [reference]
    variables:
      - {code: fx.rate, entity_type: currency_pair, measure: reference, unit: cny, frequency: monthly}

  - id: PolicyNotice
    label_en: Policy notice count
    label_zh: 政策通报数
    description: >-
      WTO TBT/SPS notifications raised per notifying member per month
      (WTO ePing feed, deduplicated by member+title+date). For
      cross-border exporters the heat answers "which markets are
      raising barriers this month".
    value_type: number
    unit_type: count
    dimensions: [tbt_sps]
    variables:
      - {code: policy.notice_count, entity_type: country, measure: tbt_sps, unit: count, frequency: monthly}

  - id: PortCalls
    label_en: Port calls
    label_zh: 港口停靠数
    description: >-
      Daily number of vessel calls at a port (IMF PortWatch). Keyed by
      the portwatch port id; the cross-border port batch registers the
      Chinese hub ports only (never offshore-terminal feeds).
    value_type: number
    unit_type: count
    dimensions: [daily_calls]
    variables:
      - {code: port.calls, entity_type: port, measure: daily_calls, unit: count, frequency: daily}

  - id: PlantedArea
    label_en: Planted area
    label_zh: 种植面积
    description: >-
      Area under cultivation for an agricultural or horticultural product, in
      hectares, as a per-country cross-section per product. Source: AIPH
      international statistical yearbook (area chapter). Each row carries its
      own reference year (2005-2024 mixed within one workbook), so the family is
      a cross-section axis, never a time series: downstream MUST surface
      ``ref_year`` and MUST NOT compute growth across differing ref_years.
      Total = open (in-soil) + protected (greenhouse/tunnel) where both are
      disclosed; a missing component stays NULL, never 0. The product axis is
      encoded in the concept code (one series per code) and the country lands
      on the entity, so two products of the same country never collide.
    value_type: number
    unit_type: hectare
    dimensions: [rose, carnation, orchid, chrysanthemum, lily, christmas_tree,
                 cut_foliage, flowering_plant, green_foliage_plant]
    variables:
      # 品类编进 concept code、国家落在 entity（同 price.food.fao.<commodity> 先例）。
      # 若把品类放在 entity 侧，同一国家的玫瑰与康乃馨会撞上 uq_sem_obs
      # (concept, entity, date, granularity) 主键而互相覆盖——这是本族的最小不变量。
      - {code: area.flower.rose.planted,               entity_type: country, measure: area, unit: hectare, frequency: annual}
      - {code: area.flower.carnation.planted,          entity_type: country, measure: area, unit: hectare, frequency: annual}
      - {code: area.flower.orchid.planted,             entity_type: country, measure: area, unit: hectare, frequency: annual}
      - {code: area.flower.chrysanthemum.planted,      entity_type: country, measure: area, unit: hectare, frequency: annual}
      - {code: area.flower.lily.planted,               entity_type: country, measure: area, unit: hectare, frequency: annual}
      - {code: area.flower.christmas_tree.planted,     entity_type: country, measure: area, unit: hectare, frequency: annual}
      - {code: area.flower.cut_foliage.planted,        entity_type: country, measure: area, unit: hectare, frequency: annual}
      - {code: area.flower.flowering_plant.planted,    entity_type: country, measure: area, unit: hectare, frequency: annual}
      - {code: area.flower.green_foliage_plant.planted, entity_type: country, measure: area, unit: hectare, frequency: annual}
      # 欧盟花卉面积（add-flower-vertical 3.3）：Eurostat apro_cpsh1 的 N0000
      # 「Flowers and ornamental plants (excluding nurseries)」只有 MAR_THS_HA
      # （主面积·千公顷）一种口径有值（产量/单产口径查询均 0 值），入库时 ×1000
      # 折成公顷，与 AIPH 的面积序列同单位可直接比对（仍分源，不混图）。
      - {code: area.flower.all.planted,                 entity_type: country, measure: area, unit: hectare, frequency: annual}

  - id: ClinicalTrial
    label_en: Clinical trial activity
    label_zh: 临床试验活动
    description: >-
      Registration activity of clinical studies, sliced by study start month.
      Sourced from ClinicalTrials.gov API v2 filtered to
      ``AREA[LocationCountry]China`` (spiders/clinicaltrials-cn). Only studies
      whose start date falls in the month are counted, so the series answers
      "how many studies started", not "how many were registered" — the latter
      would need StudyFirstPostDate and is deliberately not mixed in.
      Status transitions (recruiting -> completed) are state facts appended per
      fact-ledger, NOT variables of this family: a status is categorical and
      has no unit to aggregate.
      Upstream back-fills studies with past start dates, so historical month
      counts grow slowly; consumers MUST treat the series as revisable and MUST
      NOT pin an equality assertion on a past month (see the unit's golden).
    value_type: count
    unit_type: count
    dimensions: [new_study, planned_enrollment]
    variables:
      - {code: trial.new,               entity_type: country, measure: count_new,         unit: count,   frequency: monthly}
      - {code: trial.enrollment.planned, entity_type: trial, measure: planned_enrollment, unit: persons, frequency: monthly}

  # 聚合度量的实体粒度：count_new / catalog_entries / class_a_share 都是「范围内该期
  # 总量」，实体 = 范围（country=CN）。挂到样本实体（trial/drug）上会让同一概念在每个
  # 样本上各有一条同名值，读侧无法区分总量与个体值（add-pharma-observation-extraction D1）。
  # 逐实体的度量（planned_enrollment）仍用该实体自身（trial=注册号）。
  - id: InsuranceCatalogEntry
    label_en: Insurance drug catalog entry
    label_zh: 医保目录条目
    description: >-
      Membership of a drug in a national medical-insurance catalog edition,
      sliced by catalog year (国家基本医疗保险、生育保险和工伤保险药品目录).
      Sourced from the official PDF attachment of the publishing notice
      (spiders/nrdl-national-catalog). A row identifies (catalog_year, section,
      item_no) plus class A/B and the 限定支付范围 clause; catalog editions are
      never overwritten, so two editions both replay (fact-ledger).
      Hard boundary: this family carries classification only. Payment
      standards / retail prices are out of scope by user ruling, and the unit
      fails if any field matches an amount pattern.
    value_type: count
    unit_type: count
    dimensions: [entry_count, class_a_share]
    variables:
      - {code: catalog.drug.entries,    entity_type: country, measure: catalog_entries, unit: count,   frequency: yearly}
      - {code: catalog.drug.class_a_share, entity_type: country, measure: class_a_share, unit: percent, frequency: yearly}

  # 以下三族为**声明式**（无 variables: 种子）——对应源当前不可达，播种会造出
  # 没有任何源能填的 concepts 行（"声明≠挂载"）。载具一旦落地，再补 variables 种子。
  - id: DrugApproval
    label_en: Drug marketing approval
    label_zh: 药品批准文号
    description: >-
      Declarative only: authorisations granted to drugs, keyed by 国药准字
      number. The authoritative surface (NMPA 数据查询) actively blocks
      automated access (412 under a real browser too), so this family is
      declared for downstream derivation links without a seeded variable; see
      openspec/changes/establish-pharma-domain-stack/SOURCE-FEASIBILITY.md.
      Seeding unlocks when an accessible authoritative surface exists.
    value_type: count
    unit_type: count

  - id: ReviewProgress
    label_en: Regulatory review progress
    label_zh: 审评进度
    description: >-
      Declarative only: the ordered state machine of a marketing application
      keyed by acceptance number (受理号). CDE's data surfaces return 202 to
      both scripts and a real browser, so no variable is seeded yet. A review
      stage is a state machine, not an aggregatable measure — when seeded, the
      measure is a stage-duration or a stage-reached count, never the stage
      label itself.
    value_type: count
    unit_type: count

  - id: MedicalInstitution
    label_en: Medical institution directory
    label_zh: 医疗机构名录
    description: >-
      Declarative only: the national directory of licensed hospitals, keyed by
      institution code with grade and region. NHC returns 412 to automated
      access, so no variable is seeded yet. Whether the directory exposes
      department level is unverified (#13 in EXPECTED-SURFACE.md) and the
      department surface is explicitly out of this batch.
    value_type: count
    unit_type: count
