# FindData vocabulary — entity types.
#
# The closed set of `entity_type` values a datasource manifest may declare.
# This file is the source of truth (previously a hardcoded tuple in schema.py);
# the loader in fd_open_data_protocol/vocabulary.py reads it.
#
# URIs: https://schema.finddata.tech/entity-type/<id>
#
# Entries are never deleted — retirement is expressed with `superseded_by`.
version: "2026.11"
kind: entity-type
entries:
  - id: country
    label_en: Country
    label_zh: 国家
    description: >-
      Sovereign states and dependent territories, keyed by ISO 3166-1 alpha-2
      (CN, US, JP). Aligns with schema.org Country, Data Commons Country and
      World Bank country codes (ISO3 via wbgapi identifiers).
  - id: city
    label_en: City
    label_zh: 城市
    description: >-
      Municipalities and administrative cities (beijing, shanghai). Aligns with
      schema.org City and Data Commons City, anchored by DCID or GeoNames id.
  - id: stock
    label_en: Stock
    label_zh: 股票
    description: >-
      Listed equity issues, keyed by exchange-suffixed ticker (600000.SH,
      000001.SZ, AAPL). Aligns with schema.org Corporation at the issuer level;
      the issue itself has no schema.org type (use financials.* concepts).
  - id: fund
    label_en: Fund
    label_zh: 基金
    description: >-
      Collective investment vehicles — mutual funds and ETFs (etf_code,
      fund_code). Aligns with schema.org InvestmentFund. NAV-series data is
      keyed here, not on `stock`.
  - id: bond
    label_en: Bond
    label_zh: 债券
    description: >-
      Debt instruments (bond_code). Partial schema.org alignment only; coupon
      and yield concepts carry the economics.
  - id: index
    label_en: Index
    label_zh: 指数
    description: >-
      Market indices (SH000001, SZ399001, SPX). Aligns with Data Commons
      StatisticalVariable contexts; schema.org has no index type.
  - id: future
    label_en: Future
    label_zh: 期货
    description: >-
      Exchange-traded futures contracts (cu2412, rb2401). Contract identity
      includes the delivery month, so codes rotate.
  - id: crypto
    label_en: Cryptocurrency
    label_zh: 数字货币
    description: >-
      Crypto assets (btc, eth). Aligns with Data Commons crypto DCIDs and the
      Wikidata QID of the asset.
  - id: organization
    label_en: Organization
    label_zh: 组织
    description: >-
      General non-commercial organizations (agencies, associations). Aligns
      with schema.org Organization. Use `company` for issuers with a sector.
  - id: industry
    label_en: Industry
    label_zh: 行业
    description: >-
      Industry classification nodes (shenwan_1_01, gics_10). Aligns with
      Wikidata industry QIDs; classification system is carried in metadata.
  - id: exchange
    label_en: Exchange
    label_zh: 交易所
    description: >-
      Securities exchanges and trading venues, keyed by MIC (XNYS, XNAS, XASE)
      or FindData shorthand (SSE, SZSE). Aligns with ISO 10383 MIC.
  - id: company
    label_en: Company
    label_zh: 公司
    description: >-
      Public operating companies carrying a sector (AAPL, TSLA). Aligns with
      schema.org Corporation and the Wikidata company QID.
  - id: commodity
    label_en: Commodity
    label_zh: 大宗商品
    description: >-
      Tradable raw goods (steel, oil, grain). Aligns with Wikidata material
      QIDs; grade and delivery basis live in metadata.
  - id: person
    label_en: Person
    label_zh: 人物
    description: >-
      Human entities — fund managers, officers (logical-only; no taxonomy
      table). Aligns with schema.org Person and the Wikidata QID.
  - id: paper
    label_en: Paper
    label_zh: 论文
    description: >-
      Scholarly works — journal articles, conference papers, preprints.
      Keyed by DOI (10.1038/nature14539) or OpenAlex work id (W2919115771).
      Aligns with schema.org ScholarlyArticle.
  - id: author
    label_en: Author
    label_zh: 作者
    description: >-
      Persons credited as authors of scholarly works. Keyed by OpenAlex
      author id; distinct from `person` (which carries no scholarly role).
      Aligns with schema.org Person.
  - id: institution
    label_en: Institution
    label_zh: 机构
    description: >-
      Research and academic institutions (universities, research institutes,
      hospitals) as affiliation targets. Keyed by OpenAlex institution id;
      aligns with schema.org EducationalOrganization. `organization` covers
      generic bodies; this type is scoped to scholarly affiliation.
  - id: venue
    label_en: Venue
    label_zh: 发表载体
    description: >-
      Publication venues — journals, conference proceedings, repositories.
      Keyed by ISSN or OpenAlex source id. Aligns with schema.org
      Periodical; distinct from `organization` (a venue is not a body).
  - id: topic
    label_en: Topic
    label_zh: 主题
    description: >-
      Scholarly topics / fields of study (OpenAlex topics, concepts).
      Keyed by OpenAlex topic id; describes what a work is about.
  - id: customs_regime
    label_en: Customs regime code
    label_zh: 海关监管代码
    description: >-
      China customs supervision regime codes for cross-border e-commerce
      (9610 retail export, 1210 bonded, 9710 B2B direct export, 9810
      overseas-warehouse export). Keyed by the 4-digit regime code.
  - id: platform
    label_en: E-commerce platform
    label_zh: 电商平台
    description: >-
      Cross-border e-commerce marketplace platforms (amazon, tiktok_shop,
      temu, shein). Keyed by FindData shorthand; marketplace/store detail
      lives in metadata. Merchant-authorized data is keyed here.
  - id: hs_code
    label_en: HS commodity code
    label_zh: HS 商品编码
    description: >-
      Harmonized System commodity classifications keyed by 2/4/6-digit HS
      code (854142). WCO nomenclature; China tariff lines extend to 8-10
      digits on top of the HS6 base.
  - id: currency_pair
    label_en: Currency pair
    label_zh: 货币对
    description: >-
      FX pairs keyed by base+quote ISO codes concatenated (EURCNY). Rate
      concepts carry reference/middle rates per source; value unit is the
      quote currency.
  - id: port
    label_en: Port
    label_zh: 口岸
    description: >-
      Customs ports and logistics gateways keyed by UN/LOCODE or customs
      port code. Reserved for the cross-border port batch (authoritative
      port-code list pending; do not seed from offshore-terminal feeds).
  - id: policy
    label_en: Policy entry
    label_zh: 政策条目
    description: >-
      Individual policy/instrument entries (customs announcements, tax
      notices) keyed by issuing-body document id. Registered incrementally
      as policy patrol output lands.
  - id: drug
    label_en: Drug
    label_zh: 药品
    description: >-
      Pharmaceutical products as licensed for use — keyed by the generic name
      plus dosage form (通用名+剂型, e.g. 复方硼砂/外用液体剂). Distinct from
      `company` (the licence holder) and from `industry` (a classification
      node): a drug is an individual regulated product. Aligns with Wikidata
      drug QIDs; the approval number that authorises it lives on `approval`.
  - id: approval
    label_en: Marketing approval
    label_zh: 药品批件
    description: >-
      Regulatory authorisations for a drug — keyed by the approval number
      (国药准字 H20123456) or, before approval, the acceptance number
      (CXHS2400001). A licence is granted, varied and withdrawn over time, so
      the same drug carries many approvals; status changes are appended as new
      facts rather than overwriting (fact-ledger R1). Not `organization`: the
      holder is an organization, the licence is not.
  - id: trial
    label_en: Clinical trial
    label_zh: 临床试验
    description: >-
      Registered clinical studies — keyed by registry number (NCT06169930,
      ChiCTR2400081234, CTR20240001). Carries phase, status and enrolment as
      attributes; status transitions are appended as separate facts. Registry
      number namespaces differ per registry, so the registry id is part of the
      key, never assumed.
  - id: hospital
    label_en: Medical institution
    label_zh: 医疗机构
    description: >-
      Licensed healthcare facilities — keyed by the official institution code
      (医疗机构执业许可证登记号) with name, grade (三级甲等) and region as
      attributes. Not `institution` (that value is scoped to scholarly
      affiliation and keyed by OpenAlex id) and not `organization` (which would
      group hospitals with agencies and associations in every group-by).
  - id: indication
    label_en: Indication
    label_zh: 适应症
    description: >-
      The therapeutic use a regulatory document restricts a drug to — the
      parsed target of a 限定支付范围 clause (限伴有出血的胃、十二指肠溃疡).
      Keyed by a normalised indication string; kept distinct from `drug` so a
      restriction can be compared across drugs and catalog editions.
