name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: twine check
        run: twine check dist/*
      - name: Wheel smoke test
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install --upgrade pip
          /tmp/venv/bin/python -m pip install dist/*.whl
          # Run outside the checkout: from the repo root sys.path[0] is the source
          # tree, which would shadow the installed wheel and hide a packaging bug.
          cd /tmp
          # The vocabulary ships as package data - this fails if it did not.
          /tmp/venv/bin/python -c "from fd_open_data_protocol.vocabulary import load_vocabulary, validate_vocabulary; errs = validate_vocabulary(); assert not errs, errs; vocab = load_vocabulary(); assert len(vocab.entity_type_ids()) >= 14, vocab.entity_type_ids(); assert vocab.get('concept', 'GDP'), 'GDP family missing'; print('vocabulary smoke OK:', vocab.version, len(vocab.concept_families()), 'families')"
          # Entity-type validation resolves from the shipped file.
          /tmp/venv/bin/python -c "from fd_open_data_protocol.schema import Entity; assert Entity(entity_type='country', code='CN').entity_type == 'country'; print('schema smoke OK')"
      # establish-ontology-kernel 8.1：本体的不变量在发布前必须体检。内核不是 pip
      # 可解析的包（仓里没有 git remote、PyPI 也没有），所以按 vendored wheel 装。
      - name: Ontology conformance gate
        run: |
          /tmp/venv/bin/python -m pip install vendor/*.whl
          /tmp/venv/bin/python scripts/ontology_gate.py
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
